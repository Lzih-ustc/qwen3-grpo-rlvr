<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720" role="img" aria-labelledby="title desc">
<title id="title">GRPO reward-group diagnostics</title>
<desc id="desc">Reward-variable groups, correctness-mixed groups, and correctness-mixed groups per thousand generated tokens across both seeds.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}</style>
<text x="48" y="52" font-size="28" font-weight="700" fill="#152238" text-anchor="start">GRPO  |  What signal appeared inside each sampled group?</text>
<text x="48" y="83" font-size="15" font-weight="400" fill="#617089" text-anchor="start">All counts are reconstructed from saved rollout completions; a nonzero reward variance can come from format-only reward differences.</text>
<text x="48" y="148" font-size="16" font-weight="700" fill="#152238" text-anchor="start">Candidate</text>
<text x="340" y="148" font-size="16" font-weight="700" fill="#152238" text-anchor="start">Nonzero reward variance</text>
<text x="680" y="148" font-size="16" font-weight="700" fill="#152238" text-anchor="start">Correctness-mixed groups</text>
<text x="1035" y="148" font-size="16" font-weight="700" fill="#152238" text-anchor="start">Mixed groups / 1k tokens</text>
<line x1="48" y1="168" x2="1270" y2="168" stroke="#dbe3ef" stroke-width="2"/>

<line x1="48" y1="598" x2="1270" y2="598" stroke="#dbe3ef" stroke-width="2"/>
<text x="48" y="633" font-size="15" font-weight="600" fill="#152238" text-anchor="start">Mixed = at least one correct and one incorrect completion in the same prompt group.</text>
<text x="48" y="660" font-size="14" font-weight="400" fill="#617089" text-anchor="start">Group8 has a higher mixed-group share, but fewer absolute mixed groups and lower mixed groups per 1k tokens in both seeds.</text>
<text x="48" y="686" font-size="14" font-weight="600" fill="#617089" text-anchor="start">This is a verifier-signal-density proxy, not gradient efficacy, causal evidence, or model quality.</text>
</svg>
